<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="p-3" style="background-color: #080808;">
     <section>
        <div class="container bg-dark text-light p-4 rounded">
            <h1 class="text-center">Quiz App</h1>
            <h2 id="timeleft" class="d-flex justify-content-center">10s</h2>
            <hr class="my-4">
            <div class="d-flex">
                <div class="col-8">
                <div>
                 <span id="questionindex" class="fs-4">Q-1</span>
                 <p id="question" class="fs-5">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
           </div>
            <div class="bg-light p-2 text-dark rounded border border-1 fs-5 my-2">
                    <span>A.</span>
                     <span id="option-a">Lorem ipsum dolor sit amet.</span>
                </div>
                <div class="bg-light p-2 text-dark rounded border border-1 fs-5 my-2">
                    <span>B.</span>
                     <span id="option-b">Lorem ipsum dolor sit amet.</span>
                </div>
                <div class="bg-light p-2 text-dark rounded border border-1 fs-5 my-2">
                    <span>C.</span>
                     <span id="option-c">Lorem ipsum dolor sit amet.</span>
                </div>
                <div class="bg-light p-2 text-dark rounded border border-1 fs-5 my-2">
                    <span>D.</span>
                     <span id="option-d">Lorem ipsum dolor sit amet.</span>
                </div>
                <div class="d-flex justify-content-end">
                    <button id="btnnext" class="btn btn-primary">next</button>
                </div>
         </div>
        </div>
     </section>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
